services:
  postgres:
    image: postgres:18-alpine
    container_name: riftroom-postgres
    environment:
      POSTGRES_USER: riftroom
      POSTGRES_PASSWORD: riftroom
      POSTGRES_DB: riftroom
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - riftroom-postgres:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U riftroom -d riftroom"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  riftroom-postgres:
